<div class="admin">
  <header class="admin__header">
    <a routerLink="/admin/inicio" class="admin__logo" aria-label="Ir al inicio del panel">
      <img src="assets/icons/logo-onecine.png" alt="OneCine" />
    </a>

    @if (volver(); as volver) {
      <a [routerLink]="volver.link" class="admin__volver">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        <span>{{ volver.texto }}</span>
      </a>
    }

    <div class="admin__usuario">
      @if (empleados.actual(); as empleado) {
        <span class="admin__puesto">{{ empleado.puesto | puesto }}</span>
      }

      <button type="button" class="admin__salir" (click)="cerrarSesion()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <path d="m16 17 5-5-5-5M21 12H9" />
        </svg>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </header>

  <main class="admin__contenido">
    <router-outlet />
  </main>
</div>
